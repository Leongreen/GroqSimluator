[project]
name = "groq-rpg-simulator"
version = "0.1.0"
description = "A reality-first RPG simulator powered by Groq's fast inference"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "groq>=0.5.0",
    "textual>=0.47.0",
    "rich>=13.7.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
groq-rpg = "groq_rpg.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
